# Publishes your portfolio to GitHub Pages.
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables (Repository variables, not environment ones):
#        PROOFSTACK_PROFILE        e.g. profiles/ada/profile.yaml   (required to publish your own profile)
#        PROOFSTACK_ASSISTANT_URL  optional, https URL of your ask-my-portfolio service
# The deploy is blocked while `proofstack doctor` reports errors (TODOs, sample links...).
name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - 'profiles/**'
      - 'adapters/**'
      - 'proofstack-*/**'
      - 'schema/**'
      - 'docs/guide/**'
  workflow_dispatch:

# Only the deploy job can publish; the build job (which runs the code) only reads.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ vars.PROOFSTACK_PROFILE || 'profiles/example/profile.yaml' }}
      ASSISTANT_URL: ${{ vars.PROOFSTACK_ASSISTANT_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -DskipTests package -pl proofstack-cli -am

      - name: Ready to publish?
        run: java -jar proofstack-cli/target/proofstack.jar doctor "$PROFILE"

      - name: Build site and CV
        run: |
          ARGS=(build "$PROFILE" --out dist --with-cv --cv-link cv/cv.pdf)
          if [ -n "$ASSISTANT_URL" ]; then ARGS+=(--assistant-url "$ASSISTANT_URL"); fi
          java -jar proofstack-cli/target/proofstack.jar "${ARGS[@]}"
      # The site links to cv/cv.pdf: print it with the Chrome that GitHub-hosted runners already have.
      - name: CV to PDF
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf=dist/cv/cv.pdf "file://$PWD/dist/cv/cv.html"
          test -s dist/cv/cv.pdf
      - name: Guide
        run: cp -r docs/guide dist/guide
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
