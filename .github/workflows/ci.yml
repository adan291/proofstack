name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, unit tests and architecture tests
        run: mvn -B -ntp verify dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-deps.txt

      - name: Known vulnerabilities in runtime dependencies (OSV)
        run: python3 .github/scripts/osv_check.py $(find . -path '*/target/runtime-deps.txt')

      - name: Validate bundled profiles
        run: |
          for profile in profiles/*/profile.yaml profiles/*/profile.??.yaml; do
            [ -f "$profile" ] || continue
            java -jar proofstack-cli/target/proofstack.jar validate "$profile"
          done

  # Studio in a real browser (docs/specs/proofstack-studio-browser-tests). The runner already has Chrome.
  studio-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Browser tests (unit tests run in the verify job)
        run: mvn -B -ntp -Pe2e verify -pl proofstack-cli -am -Dtest=NoUnitTests -Dsurefire.failIfNoSpecifiedTests=false -De2e.reruns=1

  # The launcher and paths have a Windows flavour (proofstack.cmd, backslashes): build and run them there too.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Launcher passes the exit code through
        shell: cmd
        run: |
          call proofstack.cmd --version || exit /b 1
          call proofstack.cmd doctor profiles\example\profile.yaml
          if %ERRORLEVEL% NEQ 1 (echo doctor on the example must exit 1, got %ERRORLEVEL% & exit /b 1)
          rem doctor's expected 1 would otherwise become the exit code of the step
          exit /b 0
