# Publishes proofstack.jar (+ SHA-256) as a GitHub release when a tag like v0.7.0 is pushed.
name: Release CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tag matches the version in the pom
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom version $VERSION (mvn versions:set first)" >&2
            exit 1
          fi
      - name: Build and test everything
        run: mvn -B -ntp verify
      - name: Prepare assets
        run: |
          mkdir release
          cp proofstack-cli/target/proofstack.jar release/proofstack.jar
          cp proofstack-mcp-server/target/proofstack-mcp-server-*.jar release/proofstack-mcp-server.jar
          cd release && sha256sum *.jar > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
