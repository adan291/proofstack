# Publishes proofstack.jar (+ SHA-256) as a GitHub release when a tag like v0.6.0 is pushed.
name: Release CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test everything
        run: mvn -B -ntp verify
      - name: Prepare assets
        run: |
          mkdir release
          cp proofstack-cli/target/proofstack.jar release/proofstack.jar
          cp proofstack-mcp-server/target/proofstack-mcp-server-*.jar release/proofstack-mcp-server.jar
          cd release && sha256sum *.jar > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
