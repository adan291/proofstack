# Publishes proofstack.jar (+ SHA-256) as a GitHub release when a tag like v0.7.0 is pushed.
# Two jobs on purpose: the build (Maven, plugins, tests) runs with a read-only token, and only the small job that
# calls `gh release create` can write to the repository. A compromised build dependency cannot push or tag.
name: Release CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tag matches the version in the pom
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom version $VERSION (mvn versions:set first)" >&2
            exit 1
          fi
      - name: Build and test everything
        run: mvn -B -ntp verify
      - name: Prepare assets
        run: |
          mkdir release
          cp proofstack-cli/target/proofstack.jar release/proofstack.jar
          cp proofstack-mcp-server/target/proofstack-mcp-server-*.jar release/proofstack-mcp-server.jar
          cd release && sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: The assets are the ones the build checksummed
        run: cd release && sha256sum --check SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
