name: AI service image

on:
  pull_request:
    paths: ['proofstack-ai-service/**', 'proofstack-core/**', 'adapters/proofstack-yaml/**', 'pom.xml']
  push:
    tags: ['v*']

# Only the publish job, which runs on a version tag, may write to the package registry.
permissions:
  contents: read

jobs:
  # Pull requests: build the image to prove it builds, publish nothing.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -pl proofstack-ai-service -am package
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proofstack-ai-service
          push: false
          tags: proofstack-ai-service:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Version tags: build and push to GHCR.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -pl proofstack-ai-service -am package
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proofstack-ai-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/proofstack-ai-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
