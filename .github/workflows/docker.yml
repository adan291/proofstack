name: AI service image

on:
  pull_request:
    paths: ['proofstack-ai-service/**', 'proofstack-core/**', 'adapters/proofstack-in-yaml/**', 'pom.xml']
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -pl proofstack-ai-service -am package
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: proofstack-ai-service
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository_owner }}/proofstack-ai-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
