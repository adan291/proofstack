# Weekly pull requests for outdated or vulnerable dependencies. CI (osv_check.py) blocks known vulnerabilities.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      patches:
        update-types: [patch]
    ignore:
      # One Jackson on the classpath (ADR-008): it follows the version Spring Boot manages, raised with Boot.
      - dependency-name: "tools.jackson:jackson-bom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /proofstack-ai-service
    schedule:
      interval: weekly
    ignore:
      # Java LTS only (ADR-003): 25 now; the next LTS is a decision, not a weekly bump.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
