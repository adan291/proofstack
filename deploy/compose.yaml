# Local stack: Ollama + ask-my-portfolio service + Prometheus + Grafana.
#   mvn -pl proofstack-ai-service -am -DskipTests package
#   docker compose -f deploy/compose.yaml up --build
# Service:   http://localhost:8080/api/ask
# Grafana:   http://localhost:3000  (admin / $GRAFANA_ADMIN_PASSWORD, dashboard "Proofstack")
name: proofstack

services:
  ollama:
    image: ollama/ollama:0.35.1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: downloads the models the service needs, then exits.
  ollama-init:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${PROOFSTACK_CHAT_MODEL:-llama3.1} && ollama pull ${PROOFSTACK_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy

  ai-service:
    build:
      context: ../proofstack-ai-service
    image: proofstack-ai-service:local
    environment:
      OLLAMA_HOST: http://ollama:11434
      PROOFSTACK_CHAT_MODEL: ${PROOFSTACK_CHAT_MODEL:-llama3.1}
      PROOFSTACK_EMBEDDING_MODEL: ${PROOFSTACK_EMBEDDING_MODEL:-nomic-embed-text}
      PROOFSTACK_ALLOWED_ORIGINS: ${PROOFSTACK_ALLOWED_ORIGINS:-http://localhost:8000}
    volumes:
      - ${PROOFSTACK_PROFILE_DIR:-../profiles/example}:/profile:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.13.4
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [ai-service]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

volumes:
  ollama-models:
