  - id: agentlife-safety
    category: technical
    title: Agentes de IA con límites verificables en Agent Life
    context: "Los agentes escriben código sobre repositorios reales, y un fallo o\
      \ una instrucción maliciosa en el repositorio podría tocar la copia de trabajo,\
      \ la red o los secretos."
    action: "Separé permisos por rol (Arquitecto y QA solo leen, el Desarrollador\
      \ solo escribe en su worktree), validé cada diff antes de usarlo, ejecuté las\
      \ pruebas en Docker sin red y traté el contenido del repositorio y la salida\
      \ del modelo como datos, nunca como instrucciones."
    result: "Ningún agente puede hacer push, merge ni tocar .git ni CI, y el código\
      \ del agente solo se acepta si pasan las pruebas en un contenedor sin red. Unos\
      \ 200 ficheros de test, y un pre-push hook bloquea publicar con hallazgos de\
      \ seguridad altos o medios."
    areas:
      - ai
      - devops
  - category: technical
    title: Migración de un sistema legacy a API REST y cliente independiente (GES)
    context: "Gestión de Eventos era una aplicación de escritorio Java Swing con NeoDatis\
      \ ODB, difícil de evolucionar."
    action: "Definí cada fase como spec antes de programarla (arquitectura en capas,\
      \ API REST, roles, facturación) y migré a Spring Boot 3.2 con Java 21, JPA y\
      \ JWT, con un cliente JavaFX que consume la API."
    result: La API la puede consumir cualquier cliente y la interfaz se puede sustituir
      sin tocar el dominio. 51 ficheros de test.
    areas:
      - backend
      - architecture
    id: ges-migration
  - id: event-platform-backend
    category: technical
    title: Backend de una plataforma interna de eventos en Serbatic
    context: "Un equipo de 4 desarrolladores construyó entre abril y julio de 2025\
      \ una plataforma interna de eventos, y yo me encargué de la parte backend."
    action: "Diseñé la API REST en capas (app, domain, infra) con Spring Boot y MongoDB,\
      \ la seguridad con JWT y refresh tokens, la gestión de archivos sobre almacenamiento\
      \ S3 y el despliegue con Docker Compose y CI."
    result: "La API expone 7 controladores y 32 endpoints, con autenticación JWT y\
      \ archivos en almacenamiento S3. El backend fue trabajo mío: 32 de los 38 commits\
      \ del repositorio."
    areas:
      - backend
      - architecture
  - id: backend-factory-tests
    category: technical
    title: Fábrica de backends probada pieza a pieza
    context: "La fábrica son piezas independientes (asistente y BFF en TypeScript,\
      \ generador en Java, API de relaciones) que se integran por HTTP, y un cambio\
      \ en una podía romper otra sin que se notara."
    action: "Escribí primero los contratos de cada pieza en un documento de decisiones,\
      \ dividí el generador en 9 módulos Maven y cubrí cada pieza con sus propios\
      \ tests."
    result: "Más de 350 tests entre las tres piezas con código propio: unos 200 en\
      \ el generador, unos 120 en RelacionarClases y 41 en el asistente y el BFF."
    areas:
      - backend
      - architecture
  - id: relacionar-clases-performance
    category: technical
    title: "Análisis de relaciones 22 veces más rápido en RelacionarClases"
    context: "Analizar un modelo de 500 clases tardaba unos 23 segundos."
    action: "Medí con JMH antes de cambiar nada. Encontré cálculos repetidos (la similitud y el vector de características se calculaban 4 veces por cada par, y había expresiones regulares y String.format dentro de los bucles), los quité y comprobé con un test de equivalencia que los resultados no cambiaban. Después probé los value records de Valhalla en JDK 28."
    result: "El análisis de 500 clases bajó de 23 s a 1,05 s, unas 22 veces más rápido, y el ajuste con 1.000 decisiones de 1,85 s a 0,15 s. Valhalla no dio una mejora medible, así que el proyecto sigue en Java 25."
    areas:
      - backend
