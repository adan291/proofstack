        url: https://www.serbatic.es/
    areaNotes:
      architecture: "Capas app, domain e infra con comandos y consultas separados: el mapeo y el almacenamiento cambiaron sin tocar el dominio."
  - id: agent-life
    name: Agent Life
    summary: "Hotel isométrico en el que agentes de IA (Arquitecto, Desarrollador y QA) hacen trabajo real sobre un repositorio git y entregan el resultado como una rama. Presentado a Kiroween 2026."
    problem: "Un agente que escribe código sin límites es un riesgo: puede tocar el repositorio, la red o los secretos, y nadie revisa su trabajo antes de aceptarlo."
    solution: "Cada trabajo es una máquina de estados. El Arquitecto propone un plan y no se escribe nada hasta que el usuario lo aprueba. El Desarrollador trabaja en un git worktree aislado, sin shell ni red. El motor valida el diff y ejecuta las pruebas en Docker sin red, con límites de CPU, memoria y tiempo y un usuario sin privilegios. QA revisa el diff y el log, y el resultado se entrega como rama sin tocar la copia de trabajo."
    techStack:
      - TypeScript
      - pnpm monorepo
      - PixiJS
      - Vite
      - zod
      - SQLite
      - Docker
      - kiro-cli
      - Vitest
    learnings:
      - "El cliente solo habla con el servidor del mundo, que nunca llama a un modelo. Los proveedores de IA quedan detrás de una interfaz (AgentRuntime), así que cambiar de uno a otro no toca el resto."
      - "Un pre-push hook ejecuta un escáner de seguridad y bloquea la publicación si hay hallazgos altos o medios."
    links:
      - label: Demo en vivo
        url: https://adan291.github.io/agentlife-/
      - label: GitHub
        url: https://github.com/adan291/agentlife-
    areas:
      - ai
      - architecture
      - devops
    evidence:
      - agentlife-safety
    featured: true
    areaNotes:
      architecture: "Cada trabajo es una máquina de estados y los proveedores de IA están detrás de una interfaz: el servidor del mundo nunca llama a un modelo directamente."
      devops: "Las pruebas del código de los agentes se ejecutan en Docker sin red, con límites de CPU, memoria y tiempo, y un pre-push hook bloquea publicar con hallazgos de seguridad."
  - id: ges
    name: "GES: migración de Swing a Spring Boot"
    summary: "Aplicación de gestión de eventos (camareros, salones y asignaciones) migrada de una app de escritorio Java Swing a una API REST con Spring Boot y un cliente JavaFX."
    problem: "La aplicación original mezclaba interfaz y datos en un programa de escritorio con una base de datos de objetos poco habitual (NeoDatis), difícil de mantener y de usar desde otros clientes."
    solution: "Arquitectura en capas con Spring Boot 3.2 y Java 21, Spring Data JPA sobre H2, endpoints CRUD para camareros, salones y eventos, y autenticación JWT con roles. El cliente JavaFX solo consume la API. Cada fase (capas, API REST, roles, facturación) se definió como especificación antes de programarla."
    techStack:
      - Java 21
      - Spring Boot 3.2
      - Spring Data JPA
      - H2
      - JWT
      - JavaFX
      - Maven
    learnings:
      - "Separar el cliente de la API permite cambiar la interfaz sin tocar la lógica de negocio."
    links:
      - label: GitHub
        url: https://github.com/adan291/GestionDeEventos2
    areas:
      - backend
      - architecture
    evidence:
      - ges-migration
    featured: true
    areaNotes:
      architecture: "De una app de escritorio que mezclaba interfaz y datos a una API en capas con un cliente que solo la consume, definida fase a fase como especificación."
  - id: backend-factory
    name: Fábrica de backends
    summary: "Asistente web que genera un backend Spring Boot completo (entidades, relaciones, DTOs, servicios, tests y Docker) y lo entrega en un ZIP."
    problem: "Montar el esqueleto de cada backend nuevo es repetitivo y se hace a mano."
    solution: "Cuatro piezas que se comunican por HTTP, cada una en su propio repositorio: un asistente en React donde se definen el proyecto, las entidades y las relaciones; un BFF en Express que orquesta el resto; un generador en Java 25 dividido en 9 módulos Maven; y la API de RelacionarClases, que sugiere relaciones. Una revisión con IA comprueba el resultado. Los contratos entre piezas están en un documento de decisiones que se cambia antes que el código."
    techStack:
      - Java 25
      - Javalin
      - React 19
      - Vite
      - Tailwind
      - Express
      - TypeScript
      - Spring Boot
    learnings:
      - "El BFF existe porque el navegador no puede llamar directamente a algunos servicios (no tienen CORS) y las claves de API tienen que quedarse en el servidor."
      - "Medí antes de optimizar: el coste estaba en el algoritmo, no en la memoria, así que el experimento con Valhalla (JEP 401) se quedó solo en RelacionarClases."
    links:
      - label: GitHub (Backend-Skeleton)
        url: https://github.com/adan291/Backend-Skeleton
    areas:
      - architecture
      - backend
      - ai
    evidence:
      - backend-factory-tests
      - technical-content
    featured: true
    areaNotes:
      backend: "El generador en Java 25 crea entidades JPA, DTOs con MapStruct, servicios, controladores REST, tests y Docker para un proyecto Spring Boot."
      ai: "La API de RelacionarClases sugiere las relaciones entre entidades y una revisión con IA comprueba el proyecto generado."
  - id: relacionar-clases
    name: RelacionarClases
    summary: "Aplicación JavaFX que lee clases Java y propone las relaciones entre entidades (OneToOne, OneToMany…), y que aprende de lo que el usuario acepta o rechaza."
    problem: "Deducir a mano las relaciones entre decenas de entidades es lento y es fácil equivocarse."
    solution: "Combina dos análisis. El estructural lee campos, colecciones y tipos del código fuente con JavaParser. El semántico sugiere relaciones por similitud de nombres y por las decisiones anteriores del usuario, que se guardan en un JSON. También ofrece una API HTTP con Javalin, que es la que usa la Fábrica de backends."
    techStack:
      - Java 25
      - JavaFX
      - JavaParser
      - Javalin
      - Gson
      - JMH
      - jqwik
    learnings:
      - "Medir con JMH antes de tocar nada mostró que el problema eran cálculos repetidos, no el lenguaje: los value records de Valhalla (JDK 28) no dieron una mejora medible."
    links:
      - label: GitHub
        url: https://github.com/adan291/RelacionarClases
    areas:
      - ai
      - backend
    evidence:
      - relacionar-clases-performance
    featured: true
    areaNotes:
      backend: "Ofrece el análisis como API HTTP con Javalin, y lo hice 22 veces más rápido midiendo con JMH antes de optimizar."
  - id: ai-devos
    name: AI DevOS (Discord)
    summary: "Orquestador de agentes de IA sobre Discord: cada hilo es una tarea y varios agentes con roles distintos (arquitecto, desarrollador, revisor, QA…) trabajan sobre ella."
    problem: "Los bots de chat no recuerdan el contexto del proyecto ni coordinan varios roles sobre una misma tarea."
    solution: "Un gateway de Discord sin lógica de negocio reenvía los eventos a un orquestador, que carga el contexto de la organización, del proyecto y del hilo y decide qué agentes actúan y en qué orden. Un agente de memoria guarda en PostgreSQL las decisiones y los errores para tareas posteriores, un router elige el modelo según la complejidad de la tarea y una API REST permite pedir revisiones de código por HTTP."
    techStack:
