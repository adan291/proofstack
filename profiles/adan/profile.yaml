        url: https://github.com/adan291/GestionDeEventos2
    areas:
      - backend
      - architecture
    evidence:
      - ges-migration
  - id: backend-factory
    name: Fábrica de backends
    summary: "Cuatro piezas que generan un backend Spring Boot a partir de un asistente\
      \ web: interfaz y BFF en TypeScript, generador en Java 25, API de sugerencia\
      \ de relaciones y revisión con IA."
    problem: "Crear el esqueleto de un backend (entidades, relaciones, DTOs, servicios,\
      \ tests, Docker) es repetitivo y se hace a mano."
    solution: "Un asistente React define proyecto, entidades y relaciones. Un BFF\
      \ en Express orquesta el generador en Java, la API de relaciones de RelacionarClases\
      \ y la revisión con IA, y devuelve el ZIP. Cada pieza vive en su propio repositorio\
      \ y se integra por HTTP. Los contratos y los puertos están en un documento de\
      \ decisiones que se cambia antes que el código."
    techStack:
      - Java 25
      - Javalin
      - React 19
      - Vite
      - Tailwind
      - Express
      - TypeScript
      - Spring Boot
    learnings:
      - El BFF existe porque el navegador no puede llamar a algunos servicios (sin
        CORS) y las API keys deben quedarse en el servidor.
      - "Decidí medir antes de optimizar. El coste estaba en el algoritmo, no en el\
        \ boxing, así que el perfil con Valhalla (JEP 401) se limita al único proyecto\
        \ con cálculo intensivo."
    links:
