  - id: agent-life
    name: Agent Life
    summary: "Hotel isométrico donde agentes de IA reales (Arquitecto, Desarrollador,\
      \ QA) hacen trabajo de software verificable sobre un repositorio git y entregan\
      \ el resultado como una rama. Participación en Kiroween 2026."
    problem: "Un agente que escribe código sin límites es un riesgo: puede tocar el\
      \ repositorio, la red o los secretos, y nadie comprueba su resultado antes de\
      \ aceptarlo."
    solution: "Una máquina de estados por trabajo. El Arquitecto propone un plan y\
      \ nada se escribe hasta que el usuario lo aprueba. El Desarrollador trabaja\
      \ en un git worktree aislado, sin shell ni red. El motor valida el diff y ejecuta\
      \ las pruebas del proyecto en Docker con --network none, límites de CPU, memoria\
      \ y tiempo, y usuario sin privilegios. QA revisa el diff y el log, y el resultado\
      \ se entrega como rama sin tocar la copia de trabajo."
    techStack:
      - TypeScript
      - pnpm monorepo
      - PixiJS
      - Vite
      - zod
      - SQLite
      - Docker
      - kiro-cli
      - Vitest
    learnings:
      - El cliente solo habla con el world-server y este nunca llama a un modelo.
        Los proveedores quedan detrás de la interfaz AgentRuntime y cambiar de uno
        a otro no toca el resto.
      - Un pre-push hook ejecuta un escáner de seguridad y bloquea publicar con hallazgos
        altos o medios.
    links:
      - label: Demo en vivo
        url: https://adan291.github.io/agentlife-/
      - label: GitHub
        url: https://github.com/adan291/agentlife-
    areas:
      - ai
      - architecture
      - devops
    evidence:
      - agentlife-safety
