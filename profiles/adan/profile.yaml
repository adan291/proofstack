projects:
  - id: proofstack
    name: Proofstack
    summary: "Generador open source que crea un portfolio web y un CV a partir de un solo fichero, profile.yaml. Este portfolio y este CV están hechos con él."
    problem: "Un portfolio y un CV mantenidos a mano se desincronizan, y suelen ser listas de tecnologías sin pruebas de lo que se ha hecho."
    solution: "Núcleo en Java 25 con arquitectura hexagonal: no depende de ningún framework y cada salida (web, CV en Markdown, HTML, DOCX y PDF, servidor MCP, servicio de preguntas con IA) es un adaptador. Incluye importadores de LinkedIn y GitHub y un editor local en el navegador. ArchUnit comprueba las reglas de capas, cada decisión queda escrita en un ADR y GitHub Actions compila, prueba y publica la web."
    techStack:
      - Java 25
      - Maven
      - ArchUnit
      - JUnit 5
      - Playwright
      - Mustache
      - JSON Schema
      - GitHub Actions
      - Docker
    learnings:
      - "Los tests de arquitectura convierten las decisiones en reglas que no se pueden saltar."
      - "El CV se genera sin IA a propósito: un modelo que reescribe el texto acaba inventando métricas."
    links:
      - label: GitHub
        url: https://github.com/adan291/proofstack
    areas:
      - backend
      - architecture
      - devops
    evidence:
      - proofstack-quality
    areaNotes:
      architecture: "Núcleo hexagonal sin dependencias de frameworks: cada salida es un adaptador y ArchUnit hace cumplir las reglas de capas en cada build."
      devops: "Cada push compila, pasa más de 300 tests (con navegador y accesibilidad incluidos) y publica la web y el CV en GitHub Pages con GitHub Actions."
  - id: event-platform
