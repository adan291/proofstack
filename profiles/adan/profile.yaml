projects:
  - id: proofstack
    name: Proofstack
    summary: "Generador open source de portfolio web y CV a partir de un solo profile.yaml,\
      \ con importadores de LinkedIn y GitHub y un editor local. Este portfolio y\
      \ este CV están generados con él."
    problem: "Un portfolio y un CV mantenidos a mano se desincronizan, y suelen ser\
      \ listas de tecnologías sin pruebas de lo que se ha hecho."
    solution: "Dominio en Java 25 con arquitectura hexagonal: el núcleo no depende\
      \ de ningún framework y cada salida (web, CV en Markdown, HTML, DOCX y PDF,\
      \ servidor MCP, servicio de preguntas con IA) es un adaptador. Las reglas de\
      \ capas se comprueban con ArchUnit, las decisiones se documentan en ADRs y GitHub\
      \ Actions compila, prueba, publica la web en Pages y genera las releases."
    techStack:
      - Java 25
      - Maven
      - ArchUnit
      - JUnit 5
      - Playwright
      - Mustache
      - JSON Schema
      - GitHub Actions
      - Docker
    learnings:
      - Los tests de arquitectura convierten las decisiones en reglas que no se pueden
        saltar.
      - El CV se genera sin IA a propósito. Un modelo que reescribe el texto acaba
        inventando métricas.
    links:
      - label: GitHub
        url: https://github.com/adan291/proofstack
    areas:
      - backend
      - architecture
      - devops
    evidence:
      - proofstack-quality
  - id: event-platform
    name: Plataforma interna de gestión de eventos
    summary: "API REST del backend de una plataforma interna de eventos en Serbatic:\
      \ usuarios, eventos, ubicaciones, archivos multimedia y envío de correo. Proyecto\
      \ de empresa, sin repositorio público."
    problem: "La empresa necesitaba gestionar eventos, sus ubicaciones y sus archivos\
      \ desde un backend propio y seguro."
    solution: "Spring Boot 3 con Java 21 y MongoDB, organizado en capas app, domain\
      \ e infra, con comandos y consultas separados. Autenticación JWT con refresh\
      \ tokens, almacenamiento de archivos en un servicio compatible con S3, validació\
      n de ficheros, manejo global de excepciones, un planificador que actualiza el\
      \ estado de los eventos y OpenAPI para documentar la API. Se despliega con Docker\
      \ Compose y un pipeline de CI con fases de verificación, build y despliegue."
    techStack:
