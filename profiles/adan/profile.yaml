    summary: "Backend de una plataforma interna de eventos en Serbatic: usuarios, eventos, ubicaciones, archivos y envío de correo. Proyecto de empresa, sin repositorio público."
    problem: "La empresa necesitaba gestionar sus eventos, ubicaciones y archivos desde un backend propio y seguro."
    solution: "API REST con Spring Boot 3, Java 21 y MongoDB, en capas app, domain e infra y con comandos y consultas separados. Autenticación JWT con refresh tokens, archivos en almacenamiento compatible con S3, validación de ficheros y manejo global de errores. Un planificador actualiza el estado de los eventos, OpenAPI documenta la API y se despliega con Docker Compose y un pipeline de CI."
    techStack:
