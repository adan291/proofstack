      - Spring Boot 3
      - MongoDB
      - JWT
      - MapStruct
      - MinIO (S3)
      - OpenAPI
      - Docker
      - GitLab CI
      - JUnit
      - Mockito
    learnings:
      - "Separar app, domain e infra permitió cambiar el mapeo y el almacenamiento sin tocar las reglas del dominio."
    areas:
