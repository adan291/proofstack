  - id: semantic-search
    name: Búsqueda semántica con LLM local (RAG)
    summary: "Prototipo en Spring Boot que busca documentos por su significado y responde con un LLM local, sin servicios externos."
    problem: "Una búsqueda por palabras clave no encuentra un documento si la pregunta usa otras palabras (\"pedir vacaciones\" frente a \"solicitar días libres\")."
    solution: "Cada documento y cada pregunta se convierten en un vector (embedding) con nomic-embed-text sobre Ollama. Los documentos se ordenan por similitud del coseno con la pregunta y los más parecidos se pasan como contexto a un LLM local, que redacta la respuesta. Todo se sirve desde un endpoint GET /search."
    techStack:
      - Java 21
      - Spring Boot 3.3
      - Ollama
      - nomic-embed-text
      - similitud del coseno
    learnings:
      - "Es un prototipo para entender el flujo de RAG de principio a fin. Los siguientes pasos serían guardar los vectores en una base de datos y añadir pruebas."
    links:
