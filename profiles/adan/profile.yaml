    name: "GES: migración de Swing a Spring Boot"
    summary: "Aplicación de eventos con camareros, salones y asignaciones, migrada\
      \ de Java Swing con NeoDatis ODB a una API REST con Spring Boot y un cliente\
      \ JavaFX independiente."
    problem: "El sistema original mezclaba interfaz y persistencia en una aplicació\
