projects:
  - id: tomcat-jakarta-migration
    name: Migración Tomcat 9 → Tomcat 10
    summary: Paso de una aplicación Java del ecosistema javax a Jakarta EE para poder desplegar en Tomcat 10.
    problem: La aplicación usaba APIs javax.* incompatibles con Tomcat 10, que solo soporta jakarta.*.
    solution: Migración progresiva de dependencias, imports y configuración hacia Jakarta, validando por módulos.
    techStack: [Java, Tomcat 10, Jakarta EE, Maven]
    learnings:
      - Inventariar primero las dependencias transitivas que siguen en javax.
    areas: [backend]

  - id: proofstack
    name: Proofstack
    summary: Generador open source de portfolios técnicos a partir de un profile.yaml. Este portfolio está hecho con él.
    problem: Los portfolios de backend suelen ser listas de tecnologías sin pruebas.
    solution: Portfolio como código, dominio hexagonal en Java 25 y renderers intercambiables (web, CV, posts).
    techStack: [Java 25, Maven, ArchUnit, JSON Schema, Mustache]
    links:
      - { label: GitHub, url: "https://github.com/adan291/proofstack" }
    learnings:
      - Los tests de arquitectura convierten las decisiones en reglas que no se pueden saltar.
    areas: [backend, architecture]

