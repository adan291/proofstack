evidence:
  - id: proofstack-quality
    category: technical
    title: "Proofstack, a project with product quality"
    context: "I wanted my portfolio to show how I work, not just which technologies I know."
    action: "I separated the domain from the outputs with hexagonal architecture in 11 Maven modules, wrote the tests before each change, documented each decision in an ADR, and automated integration, the website and the releases with GitHub Actions."
    result: "More than 300 tests, including browser tests with Playwright, an accessibility audit with axe-core and 4 architecture tests with ArchUnit. 16 ADRs. Every push builds, tests and publishes the website and the CV."
    areas:
      - backend
      - architecture
      - devops
  - id: agentlife-safety
    category: technical
    title: AI agents with verifiable limits in Agent Life
    context: "The agents write code on real repositories, and a failure or a malicious instruction in the repository could touch the working copy, the network or the secrets."
    action: "I separated permissions by role (Architect and QA only read, the Developer only writes in its worktree), validated every diff before using it, ran the tests in Docker with no network, and treated the repository content and the model output as data, never as instructions."
    result: "No agent can push, merge or touch .git or CI, and the agent's code is only accepted if the tests pass in a container with no network. About 200 test files, and a pre-push hook blocks publishing with high or medium security findings."
    areas:
      - ai
      - devops
  - category: technical
    title: Migration of a legacy system to a REST API and a separate client (GES)
    context: "Gestión de Eventos was a Java Swing desktop application with NeoDatis ODB, hard to evolve."
    action: "I defined each phase as a spec before coding it (layered architecture, REST API, roles, invoicing) and migrated to Spring Boot 3.2 with Java 21, JPA and JWT, with a JavaFX client that consumes the API."
    result: Any client can consume the API and the interface can be replaced without touching the domain. 51 test files.
    areas:
      - backend
      - architecture
    id: ges-migration
  - id: event-platform-backend
    category: technical
    title: Backend of an internal events platform at Serbatic
    context: "A team of 4 developers built an internal events platform between April and July 2025, and I was in charge of the backend."
    action: "I designed the layered REST API (app, domain, infra) with Spring Boot and MongoDB, the security with JWT and refresh tokens, file management on S3 storage, and the deployment with Docker Compose and CI."
    result: "The API exposes 7 controllers and 32 endpoints, with JWT authentication and files on S3 storage. The backend was my work: 32 of the 38 commits in the repository."
    areas:
      - backend
      - architecture
  - id: backend-factory-tests
    category: technical
    title: Backend factory tested piece by piece
    context: "The factory is made of independent pieces (TypeScript wizard and BFF, Java generator, relationship API) integrated over HTTP, and a change in one could break another without being noticed."
    action: "I first wrote the contracts of each piece in a decision document, split the generator into 9 Maven modules and covered each piece with its own tests."
    result: "More than 350 tests across the three pieces with my own code: about 200 in the generator, about 120 in RelacionarClases and 41 in the wizard and the BFF."
    areas:
      - backend
      - architecture
  - id: relacionar-clases-performance
    category: technical
    title: "Relationship analysis 22 times faster in RelacionarClases"
    context: "Analyzing a model of 500 classes took about 23 seconds."
    action: "I measured with JMH before changing anything. I found repeated calculations (similarity and the feature vector were computed 4 times per pair, and there were regular expressions and String.format inside the loops), removed them and checked with an equivalence test that the results did not change. Then I tried Valhalla value records on JDK 28."
    result: "Analyzing 500 classes went from 23 s to 1.05 s, about 22 times faster, and adjusting against 1,000 decisions from 1.85 s to 0.15 s. Valhalla gave no measurable gain, so the project stays on Java 25."
    areas:
      - backend
  - id: team-coordination
    category: leadership
    title: Coordinating a team of 5 to 7 people in hospitality
    context: "As head of hospitality at Hotusa I ran the hospitality area of the Riosol hotel, with a team of 5 to 7 people under me."
    action: "I organized and managed the team, controlled the stock and served customers."
    result: During my time the hotel reached the highest share of groups from outside Spain it had ever had.
  - id: technical-content
    category: communication
    title: Technical content on LinkedIn and YouTube
    context: I wanted to explain migrations and applied AI to technical and non-technical audiences.
    action: "I publish posts and short videos using NotebookLM, Google AI Studio and OBS, based on real projects."
    result: "I estimate a reach of 50 to 200 people per post on LinkedIn and YouTube, with one video reaching about 1,000."
    link:
      label: CLARITY
      url: https://lnkd.in/p/eDAHqFGQ
