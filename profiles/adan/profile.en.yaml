  - id: semantic-search
    name: Semantic search with a local LLM (RAG)
    summary: "Spring Boot prototype that searches documents by meaning and answers with a local LLM, with no external services."
    problem: "Keyword search does not find a document if the question uses other words (\"request vacation\" versus \"ask for days off\")."
    solution: "Each document and each question is turned into a vector (embedding) with nomic-embed-text on Ollama. Documents are ranked by cosine similarity with the question, and the closest ones are passed as context to a local LLM, which writes the answer. Everything is served from a GET /search endpoint."
    techStack:
      - Java 21
      - Spring Boot 3.3
      - Ollama
      - nomic-embed-text
      - cosine similarity
    learnings:
      - "It is a prototype to understand the RAG flow end to end. The next steps would be storing the vectors in a database and adding tests."
    links:
