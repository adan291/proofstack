projects:
  - id: proofstack
    name: Proofstack
    summary: "Open source generator that builds a web portfolio and a CV from a single file, profile.yaml. This portfolio and this CV are made with it."
    problem: "A portfolio and a CV kept by hand drift apart, and they tend to be lists of technologies with no proof of what was done."
    solution: "Java 25 core with hexagonal architecture: it depends on no framework, and every output (website, CV in Markdown, HTML, DOCX and PDF, MCP server, AI question service) is an adapter. It includes LinkedIn and GitHub importers and a local editor in the browser. ArchUnit checks the layer rules, every decision is written down in an ADR, and GitHub Actions builds, tests and publishes the site."
    techStack:
      - Java 25
      - Maven
      - ArchUnit
      - JUnit 5
      - Playwright
      - Mustache
      - JSON Schema
      - GitHub Actions
      - Docker
    learnings:
      - "Architecture tests turn decisions into rules that cannot be skipped."
      - "The CV is generated without AI on purpose: a model that rewrites the text ends up making up metrics."
    links:
      - label: GitHub
        url: https://github.com/adan291/proofstack
    areas:
      - backend
      - architecture
      - devops
    evidence:
      - proofstack-quality
  - id: event-platform
    name: Internal event management platform
    summary: "Backend of an internal events platform at Serbatic: users, events, locations, files and email. Company project, no public repository."
    problem: "The company needed to manage its events, locations and files from its own secure backend."
    solution: "REST API with Spring Boot 3, Java 21 and MongoDB, in app, domain and infra layers with separate commands and queries. JWT authentication with refresh tokens, files on S3-compatible storage, file validation and global error handling. A scheduler updates the status of events, OpenAPI documents the API, and it is deployed with Docker Compose and a CI pipeline."
    techStack:
      - Java 21
      - Spring Boot 3
      - MongoDB
      - JWT
      - MapStruct
      - MinIO (S3)
      - OpenAPI
      - Docker
      - GitLab CI
      - JUnit
      - Mockito
    learnings:
      - "Separating app, domain and infra made it possible to change the mapping and the storage without touching the domain rules."
    areas:
      - backend
      - architecture
    evidence:
      - event-platform-backend
    links:
      - label: Serbatic (company project)
        url: https://www.serbatic.es/
  - id: agent-life
    name: Agent Life
    summary: "Isometric hotel where AI agents (Architect, Developer and QA) do real work on a git repository and deliver the result as a branch. Entered in Kiroween 2026."
    problem: "An agent that writes code with no limits is a risk: it can touch the repository, the network or the secrets, and nobody reviews its work before accepting it."
    solution: "Each job is a state machine. The Architect proposes a plan and nothing is written until the user approves it. The Developer works in an isolated git worktree, with no shell and no network. The engine validates the diff and runs the tests in Docker with no network, CPU, memory and time limits, and an unprivileged user. QA reviews the diff and the log, and the result is delivered as a branch without touching the working copy."
    techStack:
      - TypeScript
      - pnpm monorepo
      - PixiJS
      - Vite
      - zod
      - SQLite
      - Docker
      - kiro-cli
      - Vitest
    learnings:
      - "The client only talks to the world server, which never calls a model. AI providers sit behind an interface (AgentRuntime), so switching from one to another does not touch the rest."
      - "A pre-push hook runs a security scanner and blocks publishing when there are high or medium findings."
    links:
      - label: Live demo
        url: https://adan291.github.io/agentlife-/
      - label: GitHub
        url: https://github.com/adan291/agentlife-
    areas:
      - ai
      - architecture
      - devops
    evidence:
      - agentlife-safety
    featured: true
  - id: ges
    name: "GES: migration from Swing to Spring Boot"
    summary: "Event management application (waiters, halls and assignments) migrated from a Java Swing desktop app to a REST API with Spring Boot and a JavaFX client."
    problem: "The original application mixed interface and data in a desktop program with an unusual object database (NeoDatis), hard to maintain and to use from other clients."
    solution: "Layered architecture with Spring Boot 3.2 and Java 21, Spring Data JPA on H2, CRUD endpoints for waiters, halls and events, and JWT authentication with roles. The JavaFX client only consumes the API. Each phase (layers, REST API, roles, billing) was defined as a specification before writing code."
    techStack:
      - Java 21
      - Spring Boot 3.2
      - Spring Data JPA
      - H2
      - JWT
      - JavaFX
      - Maven
    learnings:
      - "Separating the client from the API makes it possible to change the interface without touching the business logic."
    links:
      - label: GitHub
        url: https://github.com/adan291/GestionDeEventos2
    areas:
      - backend
      - architecture
    evidence:
      - ges-migration
    featured: true
  - id: backend-factory
    name: Backend factory
    summary: "Web wizard that generates a complete Spring Boot backend (entities, relationships, DTOs, services, tests and Docker) and delivers it as a ZIP."
    problem: "Setting up the skeleton of every new backend is repetitive and done by hand."
    solution: "Four pieces that talk over HTTP, each in its own repository: a React wizard where you define the project, the entities and the relationships; an Express BFF that orchestrates the rest; a Java 25 generator split into 9 Maven modules; and the RelacionarClases API, which suggests relationships. An AI review checks the result. The contracts between pieces live in a decisions document that is changed before the code."
    techStack:
      - Java 25
      - Javalin
      - React 19
      - Vite
      - Tailwind
      - Express
      - TypeScript
      - Spring Boot
    learnings:
      - "The BFF exists because the browser cannot call some services directly (they have no CORS) and API keys have to stay on the server."
      - "I measured before optimizing: the cost was in the algorithm, not in memory, so the Valhalla (JEP 401) experiment stayed in RelacionarClases only."
    links:
      - label: GitHub (Backend-Skeleton)
        url: https://github.com/adan291/Backend-Skeleton
    areas:
      - architecture
      - backend
      - ai
    evidence:
      - backend-factory-tests
      - technical-content
    featured: true
  - id: relacionar-clases
    name: RelacionarClases
    summary: "JavaFX application that reads Java classes and suggests the relationships between entities (OneToOne, OneToMany…), and learns from what the user accepts or rejects."
    problem: "Working out the relationships between dozens of entities by hand is slow and easy to get wrong."
    solution: "It combines two analyses. The structural one reads fields, collections and types from the source code with JavaParser. The semantic one suggests relationships from name similarity and from the user's past decisions, saved in a JSON file. It also offers an HTTP API with Javalin, which is the one the backend factory uses."
    techStack:
      - Java 25
      - JavaFX
      - JavaParser
      - Javalin
      - Gson
      - JMH
      - jqwik
    learnings:
      - "Measuring with JMH before changing anything showed that the problem was repeated calculations, not the language: Valhalla value records (JDK 28) gave no measurable gain."
    links:
      - label: GitHub
        url: https://github.com/adan291/RelacionarClases
    areas:
      - ai
      - backend
    evidence:
      - relacionar-clases-performance
    featured: true
  - id: ai-devos
    name: AI DevOS (Discord)
    summary: "AI agent orchestrator on Discord: each thread is a task, and several agents with different roles (architect, developer, reviewer, QA…) work on it."
    problem: "Chat bots do not remember the project context and do not coordinate several roles on the same task."
    solution: "A Discord gateway with no business logic forwards events to an orchestrator, which loads the context of the organization, the project and the thread and decides which agents act and in what order. A memory agent stores decisions and mistakes in PostgreSQL for later tasks, a router picks the model by task complexity, and a REST API lets you request code reviews over HTTP."
    techStack:
      - TypeScript
      - Node.js
      - discord.js
      - PostgreSQL
      - Drizzle
      - Redis
      - Vitest
    learnings:
      - "Separating the gateway from the orchestrator makes it possible to add Slack, Telegram or webhooks without touching the agents."
    links:
      - label: GitHub
        url: https://github.com/adan291/AI-DevOS
    areas:
      - ai
      - architecture
    featured: true
