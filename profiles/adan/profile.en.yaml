    name: StreamCrowd
    summary: "Web app for Twitch, YouTube and Kick streamers: live polls, giveaways, predictions, more than 13 mini-games and OBS overlays."
    problem: "Streamers depend on many chat commands and several separate tools to interact with their audience."
    solution: "A single React 19 and TypeScript app that turns those commands into buttons and panels. It reads the chat in real time, shows the results as OBS overlays, uses Firebase for sign-in and installs as an app (PWA) on desktop and mobile. It has 147 test files with Vitest and Playwright."
