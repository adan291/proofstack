<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <link rel="icon" href="data:,">
  <title>Proofstack Studio</title>
  <link rel="stylesheet" href="/assets/studio.css">
  <script type="module" src="/assets/studio.js"></script>
</head>
<body>
<a class="skip" href="#editor">Saltar al editor</a>
<header class="bar">
  <h1 class="bar__title">Proofstack Studio</h1>
  <p id="status" class="bar__status" role="status" aria-live="polite"></p>
  <button id="reload" class="btn" type="button" hidden>Recargar desde el disco</button>
  <button id="save" class="btn btn--primary" type="button" disabled>Guardar <kbd>Ctrl+S</kbd></button>
</header>

<p id="loading" class="loading">Cargando el editor…</p>

<div id="app" class="layout" hidden>
  <nav class="nav" aria-label="Secciones del perfil">
    <ul id="sections" class="nav__list"></ul>
  </nav>

  <main id="editor" class="editor" tabindex="-1" aria-label="Editor"></main>

  <aside class="side" aria-label="Avisos y vista previa">
    <section class="issues" aria-labelledby="issues-title">
      <h2 id="issues-title" class="side__title">Antes de publicar</h2>
      <p id="issues-count" class="issues__count"></p>
      <ul id="issues" class="issues__list"></ul>
    </section>
    <section class="preview" aria-labelledby="preview-title">
      <h2 id="preview-title" class="side__title">Vista previa (lo guardado)</h2>
      <div class="preview__tabs" role="tablist" aria-label="Qué previsualizar">
        <button class="preview__tab" type="button" role="tab" aria-selected="true" data-preview="cv">CV</button>
        <button class="preview__tab" type="button" role="tab" aria-selected="false" data-preview="site">Web</button>
      </div>
      <iframe id="preview-frame" class="preview__frame" sandbox="allow-scripts" title="Vista previa"></iframe>
    </section>
  </aside>
</div>
</body>
</html>
